name: Deploy frontend to GitHub Pages

# GitHub Pages cannot be enabled on this repo directly because it is private
# and private-repo Pages requires a paid GitHub plan. Instead, this workflow
# builds the frontend here and publishes the static output to the public
# "didar-platform-demo" repo, which serves it via GitHub Pages. Source code
# stays private; only the compiled, static SPA bundle is made public.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

env:
  DEMO_REPO: alan14alashti/didar-platform-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # VITE_BASE_PATH must match "/<demo-repo-name>/" since that's the path
        # GitHub Pages serves this project page under. VITE_API_BASE_URL
        # points the static build at a live backend; set the repo variable to
        # a publicly reachable API URL for full functionality (auth,
        # listings, bookings). Without it, the UI renders but API calls fail.
        env:
          VITE_BASE_PATH: /didar-platform-demo/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8080/api/v1' }}
        run: npm run build

      - name: Add SPA fallback (404.html)
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Publish to public demo repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ env.DEMO_REPO }}
          publish_branch: gh-pages
          publish_dir: frontend/dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy ${{ github.sha }}'
